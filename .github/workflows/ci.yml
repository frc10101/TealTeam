name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI, but not in local development, where a warning while
  # you are mid-thought is just noise.
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # The crate-boundary gate (F2).
  #
  # This is the most important job in the file and the cheapest. tt-core and
  # tt-templates must compile to wasm32-unknown-unknown, which they can only do
  # while they stay free of sqlx, axum, tokio's net/fs features, reqwest, and
  # chrono's "clock" feature.
  #
  # That is not a hypothetical constraint. The retired Rust implementation put
  # ~187 inline sqlx queries inside its handlers, which made moving any logic
  # browser-side impossible without a rewrite -- the single largest item in the
  # refurbish plan. This job is what stops that happening again, and it catches
  # the leak on the commit that introduces it rather than six months later.
  #
  # If this fails: the code you just added belongs in an adapter crate
  # (tt-repo-sqlite, tt-web), not in the domain.
  # ---------------------------------------------------------------------------
  wasm-boundary:
    name: wasm32 boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust with wasm32 target
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      # tt-pages: the pages the service worker makes with no server (C5).
      - name: Build pure crates for wasm32
        run: cargo build -p tt-core -p tt-templates -p tt-pages --target wasm32-unknown-unknown --locked

      # The FIRST/TBA clients run in a browser too (S4). A separate build:
      # cargo unifies features within one, and tt-upstream's chrono "clock"
      # would hide that same leak into tt-core.
      - name: Build the upstream clients for wasm32
        run: cargo build -p tt-upstream --target wasm32-unknown-unknown --locked

      # The browser's repo (C4), on its own for the same reason. Its SQLite
      # is C that sqlite-wasm-rs compiles with clang, which the runner has.
      - name: Build the browser repo for wasm32
        run: cargo build -p tt-client --target wasm32-unknown-unknown --locked

  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The offline client (C14), before the tests so they and the binary
      # embed it, as a Pi's build does. build-client.sh installs the pinned
      # wasm-bindgen CLI into ~/.cargo/wasm-bindgen-<version>/ when missing.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/wasm-bindgen-0.2.127
          key: wasm-bindgen-cli-0.2.127-${{ runner.os }}

      - name: Build the offline client bundle
        run: deploy/build-client.sh

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Tests
        run: cargo test --workspace --locked

      # Cargo.lock is committed, so --locked above already fails on drift. This
      # names the problem when it happens.
      - name: Lockfile is current
        run: cargo metadata --format-version 1 --locked > /dev/null
