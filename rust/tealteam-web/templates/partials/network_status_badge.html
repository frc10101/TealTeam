<div id="network-status-badge" class="rounded-lg border px-3 py-2 text-xs {{ css_class }}">
    <div class="flex flex-wrap items-center gap-3">
        <span class="font-semibold uppercase tracking-wide">{{ label }}</span>
        <span class="opacity-85">Last Sync: {{ last_sync }}</span>
        <span class="opacity-85">Last API OK: {{ last_api_success }}</span>
    </div>
    {% if status == "api-error" && !last_api_error.is_empty() %}
    <div class="mt-1 opacity-90">API: {{ last_api_error }}</div>
    {% endif %}
    {% if status == "offline" && !internet_error.is_empty() %}
    <div class="mt-1 opacity-90">Network: {{ internet_error }}</div>
    {% endif %}
</div>
