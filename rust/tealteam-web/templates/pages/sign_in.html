{% extends "layout.html" %}
{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="text-center">
            <h2 class="text-3xl font-bold text-gray-100 mb-2">Sign in to your account</h2>
            <p class="text-gray-400">Access scouting data, analytics, and team management features.</p>
        </div>

        <div class="card">
            <div class="card-header accent-teal">
                <h3 class="text-lg font-semibold text-gray-100">Sign In</h3>
            </div>
            <div class="card-body">
                <div id="form-response" class="fade-swap"></div>
                <form action="/api/auth/login" method="post" up-submit up-target="#form-response" class="space-y-6 mt-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email address</label>
                        <input id="email" name="email" type="email" autocomplete="email" required
                            class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-colors" placeholder="email@example.com">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                            class="w-full px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-colors" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 focus:ring-offset-gray-900 transition-colors">Sign in</button>
                    <div id="signin-indicator" class="htmx-indicator flex items-center justify-center gap-2 text-xs text-gray-400">
                        <span class="loading-spinner"></span> Signing in...
                    </div>
                </form>
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-400">Don't have an account?
                        <a href="/sign-up" class="font-medium text-teal-400 hover:text-teal-300 transition-colors">Sign up here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
