{% extends "layout.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-100 mb-6">Account Settings</h1>

        <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-100 mb-4">Account Information</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Name</label>
                        <p class="text-gray-200">{{ user_name }}</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                        <p class="text-gray-200">{{ user_email }}</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Team Number</label>
                        <p class="text-gray-200">{{ team_display }}</p>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Roles &amp; Permissions</label>
                    <div class="flex gap-2 flex-wrap">
                        {% for badge in role_badges %}
                        <span class="inline-block px-3 py-1 bg-gray-700/30 border border-gray-600 rounded text-gray-200 text-sm font-medium">{{ badge }}</span>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-gray-800 border border-gray-700 rounded-lg p-6">
            <h2 class="text-xl font-semibold text-gray-100 mb-4">Change Password</h2>
            <div id="password-response" class="mb-4"></div>
            <form id="change-password-form" action="/api/account/change-password" method="post" up-submit up-target="#password-response" class="space-y-4">
                <div>
                    <label for="current-password" class="block text-sm font-medium text-gray-300 mb-2">Current Password</label>
                    <input type="password" id="current-password" name="current-password" required
                        class="w-full px-4 py-2 rounded-lg border border-gray-700 bg-gray-900 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" placeholder="Enter your current password" />
                </div>
                <div>
                    <label for="new-password" class="block text-sm font-medium text-gray-300 mb-2">New Password</label>
                    <input type="password" id="new-password" name="new-password" required minlength="8"
                        class="w-full px-4 py-2 rounded-lg border border-gray-700 bg-gray-900 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" placeholder="Enter a new password (minimum 8 characters)" />
                    <p class="text-xs text-gray-400 mt-1">Password must be at least 8 characters long</p>
                </div>
                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-300 mb-2">Confirm New Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required minlength="8"
                        class="w-full px-4 py-2 rounded-lg border border-gray-700 bg-gray-900 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent" placeholder="Confirm your new password" />
                </div>
                <button type="submit" class="w-full btn btn-primary">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
