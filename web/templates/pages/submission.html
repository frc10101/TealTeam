{{define "content"}}
<div class="space-y-8">
    <!-- Page Header -->
    <div>
        <h1 class="text-3xl font-bold text-gray-100">{{.Title}}</h1>
        <p class="mt-2 text-gray-400">{{.Description}}</p>
    </div>

    <div class="card">
        <div class="card-header accent-teal">
            <h2 class="text-xl font-semibold text-gray-100">Scouting Form</h2>
        </div>
        <div class="card-body">
            {{template "scouting_form" .}}
        </div>
    </div>
</div>
{{end}}
