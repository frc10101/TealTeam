# The Pi's names and no-gateway rule, for the laptop's wired port in
# NetworkManager shared mode (deploy/pi/network/dnsmasq-tealteam.conf is the
# Pi's). Installed to /etc/NetworkManager/dnsmasq-shared.d/tealteam.conf by
# omenMaxwell-setup.sh; shared mode already hands out 10.101.0.x with the
# laptop as DNS.

# No gateway: a client with its own internet keeps using it, and this laptop's
# hotspot is not passed on. Only the server is reached over the cable.
dhcp-option=option:router

# The server by name, over plain DNS, for clients that do not ask mDNS.
address=/tealteam.local/10.101.0.1
address=/tealteam/10.101.0.1
