# Addresses for the wired clients, and the server's name for those that do not
# speak mDNS (P4, P6). Installed to /etc/dnsmasq.d/tealteam.conf by setup.sh.

# eth0 only, and follow it if it comes up after dnsmasq does.
interface=eth0
bind-dynamic
except-interface=lo

# Clients get an address and the Pi as DNS -- and no gateway. A tablet with its
# own cellular keeps using it for the internet; only the server is reached
# over the cable.
dhcp-range=10.101.0.50,10.101.0.250,255.255.255.0,12h
dhcp-option=option:router
dhcp-option=option:dns-server,10.101.0.1
dhcp-authoritative

# The server by name, over plain DNS: http://tealteam.local and http://tealteam.
address=/tealteam.local/10.101.0.1
address=/tealteam/10.101.0.1

# Answer for our names only. Nothing is forwarded: this network has no
# internet to offer its clients.
no-resolv
domain-needed
bogus-priv
