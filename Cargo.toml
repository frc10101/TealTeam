[workspace]
resolver = "2"
members = ["crates/*"]

# Dependencies are declared once here and inherited by member crates with
# `workspace = true`, so a version bump happens in exactly one place.
#
# The crate boundary this workspace exists to protect:
#
#   tt-core, tt-templates  -- pure. MUST compile to wasm32-unknown-unknown.
#                             No sqlx, no axum, no tokio net/fs/time-driver.
#   tt-repo                -- the Repo trait. Abstract; also wasm-clean.
#   tt-pages               -- pages built from a Repo, run by tt-web and, with
#                             no server, by tt-client in the service worker
#                             (C5). Also wasm-clean.
#   tt-upstream            -- the FIRST/TBA clients also compile to wasm32, so a
#                             browser with signal fetches upstream itself (S4).
#                             The sync loop and the journal are native-only.
#   tt-repo-sqlite         -- server-side adapter. sqlx lives here and nowhere else.
#   tt-client              -- the browser's adapter (C4): the same schema over
#                             SQLite compiled to wasm, kept in OPFS. rusqlite,
#                             not sqlx, which has no wasm32 build.
#   tt-web                 -- axum binary. The only crate that knows about HTTP.
#
# CI enforces this (.github/workflows/ci.yml). If you find yourself adding a
# server-only dependency to tt-core, that is the design telling you the code
# belongs in an adapter.
[workspace.dependencies]
tt-core = { path = "crates/tt-core" }
tt-templates = { path = "crates/tt-templates" }
tt-repo = { path = "crates/tt-repo" }
tt-repo-sqlite = { path = "crates/tt-repo-sqlite" }
tt-upstream = { path = "crates/tt-upstream" }
tt-client = { path = "crates/tt-client" }
tt-pages = { path = "crates/tt-pages" }

anyhow = "1"
askama = "0.16"
async-trait = "0.1"
argon2 = "0.5"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
futures-util = { version = "0.3", default-features = false }
# Reading a query string in the service worker's pages (C5), as axum's
# `Query` does on the server.
form_urlencoded = "1"
base64 = "0.22"
rand = "0.9"
# rustls, never OpenSSL: the release binary must have no system TLS dependency
# on a Raspberry Pi.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
# The IANA database, compiled in: an event's zone must resolve on a Pi with
# no /usr/share/zoneinfo, and in a browser (Q5).
chrono-tz = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
# The browser's SQLite (C4). On wasm32 it runs on sqlite-wasm-rs, which builds
# SQLite's C with clang. 0.39 because it shares sqlx's libsqlite3-sys (0.37):
# two versions of it cannot link into one workspace.
rusqlite = { version = "0.39", default-features = false, features = ["serialize"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trait-variant = "0.1"
# The browser side of tt-upstream (S4): a timer for retry backoff, over the
# same wasm-bindgen that reqwest's fetch backend already pulls in.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Offline auth tokens (C9): PASETO v4.public is Ed25519. Pure Rust, so a
# token verifies the same in the browser's wasm as on the Pi, with no
# crypto.subtle (which plain http does not offer). No rand_core: the server
# makes the key's 32 bytes itself.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "fast"] }
# The pick list's CRDT (L14). Pure Rust and wasm-clean, so a browser replica
# merges the same way the server does.
yrs = "0.28"

[profile.release]
lto = true
strip = true
