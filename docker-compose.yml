# Docker Compose for local development
# Provides PostgreSQL database

services:
  db:
    image: postgres:16-alpine
    container_name: tealteam_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: yourdb
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      # Persist Postgres data on the host so data survives full power cycles.
      - ${DB_DATA_PATH:-./.data/postgres}:/var/lib/postgresql/data
      # Optionally run migrations on startup:
      # - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d yourdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: tealteam_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
      DATABASE_URL: postgres://user:password@db:5432/yourdb?sslmode=disable
      # Explicitly pass environment variables from .env
      FIRST_API_USERNAME: ${FIRST_API_USERNAME}
      FIRST_API_KEY: ${FIRST_API_KEY}
      FIRST_SEASON: ${FIRST_SEASON}
      FIRST_SYNC_ON_BOOT: ${FIRST_SYNC_ON_BOOT}
      FIRST_EVENT_CODE: ${FIRST_EVENT_CODE}
      FIRST_TEAM_NUMBER: ${FIRST_TEAM_NUMBER}
      FIRST_COUNTRY: ${FIRST_COUNTRY}
      TBA_AUTH_KEY: ${TBA_AUTH_KEY}
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # Note: Volume mount enabled for template hot-reload during development
    volumes:
      - ./web/templates:/app/web/templates

  # Test service - runs Go tests
  test:
    build:
      context: .
      target: builder
    container_name: tealteam_test
    working_dir: /app
    env_file:
      - .env
    environment:
      CGO_ENABLED: 0
      DATABASE_URL: postgres://user:password@db:5432/yourdb?sslmode=disable
      FIRST_API_USERNAME: ${FIRST_API_USERNAME}
      FIRST_API_KEY: ${FIRST_API_KEY}
      FIRST_SEASON: ${FIRST_SEASON}
      FIRST_SYNC_ON_BOOT: ${FIRST_SYNC_ON_BOOT}
      FIRST_EVENT_CODE: ${FIRST_EVENT_CODE}
      FIRST_TEAM_NUMBER: ${FIRST_TEAM_NUMBER}
      FIRST_COUNTRY: ${FIRST_COUNTRY}
      TBA_AUTH_KEY: ${TBA_AUTH_KEY}
    command: go test -v -cover ./...
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Optional: Adminer for database management
  adminer:
    image: adminer
    container_name: tealteam_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"
    depends_on:
      - db

# Usage:
# Start: docker-compose up -d
# Stop: docker-compose down
# View logs: docker-compose logs -f db
# Reset DB: docker-compose down -v && docker-compose up -d
