{% extends "layout.html" %}
{% block content %}
<section class="card narrow">
  <div class="card-header"><h1>Sign in</h1></div>
  <div class="card-body">
    {% if !error.is_empty() %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/api/auth/login" class="stack">
      <label class="field">
        <span class="form-label">Email</span>
        <input class="form-input" type="email" name="email" value="{{ email }}"
               autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span class="form-label">Password</span>
        <input class="form-input" type="password" name="password"
               autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    <p class="muted">No account? <a href="/sign-up">Create one</a>.</p>
  </div>
</section>
{% endblock %}
