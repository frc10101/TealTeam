[package]
name = "tt-core"
version = "0.1.0"
edition = "2024"
description = "Pure TealTeam domain logic. Compiles to wasm32; no I/O, no database, no HTTP."

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
ed25519-dalek = { workspace = true }
miniz_oxide = { workspace = true }
qrcodegen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
yrs = { workspace = true }

[dev-dependencies]
# Reads back the codes `qr` draws, with a decoder that shares none of its code.
rqrr = { version = "0.10", default-features = false }

# NOTE: this crate must never gain sqlx, axum, tokio, reqwest, or chrono's
# "clock" feature. Functions that need the current time take it as a parameter
# -- which is also what makes them testable. See the CI wasm32 gate.
