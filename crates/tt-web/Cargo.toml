[package]
name = "tt-web"
version = "0.1.0"
edition = "2024"
description = "axum server binary. The only crate that knows about HTTP."

[dependencies]
tt-core = { workspace = true }
tt-templates = { workspace = true }
tt-repo = { workspace = true }
tt-pages = { workspace = true }
tt-repo-sqlite = { workspace = true }
tt-upstream = { workspace = true }

anyhow = { workspace = true }
argon2 = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
# The scouting assistant's model, on the LAN or Anthropic's API (AI1).
reqwest = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
sqlx = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
# `tt-web dev` drives the router in-process with `oneshot` (F13); the tests do too.
tower = { version = "0.5", features = ["util"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "tokio", "service", "http1", "http2"] }

[dev-dependencies]
form_urlencoded = { workspace = true }
# The device's side of a push, run against the real router (C7).
tt-client = { workspace = true }
