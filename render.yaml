databases:
  - name: tealteam-db
    databaseName: tealteam_db
    plan: free

services:
  - type: web
    name: tealteam
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    preDeployCommand: echo "Migrations will run on application startup"
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: tealteam-db
          property: connectionString
      - key: FIRST_API_USERNAME
        sync: false
      - key: FIRST_API_KEY
        sync: false
      - key: TBA_AUTH_KEY
        sync: false