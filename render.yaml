# Render Blueprint - Infrastructure as Code
# https://render.com/docs/blueprint-spec

services:
  # Web Service
  - type: web
    name: tealteam
    runtime: docker
    repo: https://github.com/NotMaxwell/TealTeam # Update with your repo
    branch: main
    plan: free # or starter, standard, etc.
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: tealteam-db
          property: connectionString

databases:
  # PostgreSQL Database
  - name: tealteam-db
    plan: free # free tier: 1GB storage, expires after 90 days
    databaseName: tealteam
    user: tealteam
