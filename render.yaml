databases:
  - name: tealteam-db
    databaseName: tealteam_db
    plan: free

services:
  - type: web
    name: tealteam
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /server -env=prod
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: GIN_MODE
        value: release
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: tealteam-db
          property: connectionString
      - key: FIRST_API_USERNAME
        sync: false
      - key: FIRST_API_KEY
        sync: false
      - key: FIRST_SEASON
        value: "2026"
      - key: FIRST_SYNC_ON_BOOT
        value: "true"
      - key: FIRST_EVENT_CODE
        value: ""
      - key: FIRST_TEAM_NUMBER
        value: ""
      - key: FIRST_COUNTRY
        value: ""
      - key: TBA_AUTH_KEY
        sync: false
