services:
  - type: web
    name: tealteam
    runtime: docker
    # ... existing config ...
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: ENVIRONMENT
        value: production
      - key: TRUST_PROXY
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: tealteam-db
          property: connectionString
      - key: FIRST_API_USERNAME
        sync: false
      - key: FIRST_API_KEY
        sync: false
      - key: TBA_AUTH_KEY
        sync: false